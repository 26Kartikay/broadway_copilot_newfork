# Production stack: bot + Postgres + Redis.
# Usage (from repo root):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# DATABASE_URL: set in .env to your Postgres. If unset, defaults to bundled `db` container.
# External DBs (RDS etc.): set SKIP_PRISMA_DB_PUSH=true — never run db push against managed DBs.
# UPLOADS_HOST_DIR: host directory mounted to /app/uploads (default ./uploads).
# SERVER_URL must be the public base URL (no trailing slash), e.g. https://api.yourdomain.com
#
# Optional tunnel:
#   docker compose -f docker-compose.prod.yml --profile tunnel up -d

name: broadway-bot-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: broadway-bot-prod-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-broadway}?schema=public}
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL in .env (public base URL, no default)}
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/app/uploads}
      SKIP_PRISMA_DB_PUSH: ${SKIP_PRISMA_DB_PUSH:-}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        log() { printf '%s\n' "$${*}"; }

        log "Waiting for Postgres..."
        until node <<'NODE' >/dev/null 2>&1; do
        const net = require('net');
        const host = process.env.POSTGRES_HOST || 'db';
        const port = Number(process.env.POSTGRES_PORT || 5432);
        const socket = net.createConnection({ host, port }, () => {
          socket.end();
          process.exit(0);
        });
        const fail = () => process.exit(1);
        socket.on('error', fail);
        setTimeout(fail, 2000);
        NODE
          sleep 1
        done
        log "Postgres is ready."

        log "Preflight (legacy Product.handleId unique constraint)..."
        npx prisma db execute --file scripts/preflight-db-push.sql --schema prisma/schema.prisma

        USE_BUNDLED_DB=0
        case "$${DATABASE_URL:-}" in *"@db:"*) USE_BUNDLED_DB=1 ;; esac
        if [ "$${SKIP_PRISMA_DB_PUSH:-}" = "true" ]; then
          log "Skipping prisma db push (SKIP_PRISMA_DB_PUSH=true)."
        elif [ "$$USE_BUNDLED_DB" -eq 1 ]; then
          log "Syncing database schema (db push) against bundled Postgres..."
          npx prisma db push
        else
          log "External DATABASE_URL: skipping prisma db push."
        fi
        log "Starting app..."
        exec node dist/index.js
    networks:
      - broadway-network

  guest-cleanup-cron:
    image: broadway-bot-prod-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-broadway}?schema=public}
      GUEST_CLEANUP_CRON: ${GUEST_CLEANUP_CRON:-0 * * * *}
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        : "${DATABASE_URL:?DATABASE_URL is required for guest cleanup cron}"
        CRON_EXPR="${GUEST_CLEANUP_CRON:-0 * * * *}"

        printf 'export DATABASE_URL=%q\n' "$${DATABASE_URL}" > /etc/guest-cleanup.env
        cat > /usr/local/bin/run-guest-cleanup.sh <<'EOF'
        #!/bin/bash
        set -Eeuo pipefail
        source /etc/guest-cleanup.env
        psql "$${DATABASE_URL}" -c "DELETE FROM \"User\" WHERE \"isGuest\" = true OR LOWER(TRIM(\"profileName\")) = 'guest';"
        EOF
        chmod +x /usr/local/bin/run-guest-cleanup.sh

        cat > /etc/cron.d/guest-user-cleanup <<EOF
        SHELL=/bin/bash
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        $${CRON_EXPR} root /usr/local/bin/run-guest-cleanup.sh >> /var/log/guest-user-cleanup.log 2>&1
        EOF
        chmod 0644 /etc/cron.d/guest-user-cleanup
        crontab /etc/cron.d/guest-user-cleanup
        touch /var/log/guest-user-cleanup.log
        exec cron -f
    depends_on:
      db:
        condition: service_healthy
    networks:
      - broadway-network

  vibe-check-reminder-cron:
    image: broadway-bot-prod-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-broadway}?schema=public}
      COMMS_SERVICE_URL: ${COMMS_SERVICE_URL:-}
      CRON_VIBE_CHECK_REMINDER_ENABLED: ${CRON_VIBE_CHECK_REMINDER_ENABLED:-true}
    command: ["node", "dist/automation/cron/vibeCheckReminderCron.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - broadway-network

  db:
    image: pgvector/pgvector:pg16-bookworm
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broadway-network

  redis:
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - broadway-network

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - tunnel
    command:
      - http
      - --domain=${NGROK_DOMAIN:-}
      - "app:${PORT:-8080}"
      - --log=stdout
      - --log-level=warn
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    networks:
      - broadway-network

networks:
  broadway-network:
    name: broadway-network

volumes:
  postgres_prod_data:
  redis_prod_data:
