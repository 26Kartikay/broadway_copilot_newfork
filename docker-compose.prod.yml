# Production-style stack: built image (no bind-mounted source), Postgres, Redis.
# User/chat images are written under /app/uploads in the container. Mount a host
# directory so uploads survive restarts and you can add files from the host.
#
# Usage (on the VM):
#   cp .env .env.production   # optional
#   export PORT=8081   # optional; default 8080. SERVER_URL must use the same port.
#   export SERVER_URL=http://3.108.221.167:8081
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# DATABASE_URL: set in .env to your real Postgres (e.g. RDS). If unset, defaults to bundled `db`.
# External URLs must not use host "localhost" from inside the container — use the cloud hostname
# or host IP. For RDS/managed DBs, `db push` is skipped automatically (it cannot reconcile enum
# drift without dropping columns). Apply schema with `prisma migrate deploy` or manual SQL.
# To skip push even for bundled db: SKIP_PRISMA_DB_PUSH=true
#
# Uploads on the host (default ./uploads) → container /app/uploads. Override with UPLOADS_HOST_DIR.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Prefer DATABASE_URL from --env-file / shell so the app can use an external DB; else bundled Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/broadway?schema=public}
      REDIS_URL: redis://redis:6379
      # Must be reachable by clients that load /uploads/... URLs (browser, vision APIs).
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL to your public base URL, e.g. https://example.com}
      # Set true to never run `prisma db push` on startup (e.g. strict production policy).
      SKIP_PRISMA_DB_PUSH: ${SKIP_PRISMA_DB_PUSH:-}
    # Host:container must be the SAME port as PORT above. If `docker ps` shows
    # 8081->8080 while PORT=8081, nothing listens on 8080 inside — curl will fail.
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Persist chat/user uploads; place files here on the host to expose them as /uploads/...
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads

    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        log() { printf '%s\n' "$${*}"; }

        log "Waiting for Postgres..."
        until node <<'NODE' >/dev/null 2>&1; do
        const net = require('net');
        const host = process.env.POSTGRES_HOST || 'db';
        const port = Number(process.env.POSTGRES_PORT || 5432);
        const socket = net.createConnection({ host, port }, () => {
          socket.end();
          process.exit(0);
        });
        const fail = () => process.exit(1);
        socket.on('error', fail);
        setTimeout(fail, 2000);
        NODE
          sleep 1
        done
        log "Postgres is ready."

        log "Preflight (legacy Product.handleId unique constraint)..."
        npx prisma db execute --file scripts/preflight-db-push.sql --schema prisma/schema.prisma

        # db push against RDS often fails on enum/type drift (e.g. gender) — it would DROP columns.
        USE_BUNDLED_DB=0
        case "$${DATABASE_URL:-}" in *"@db:"*) USE_BUNDLED_DB=1 ;; esac
        if [ "$${SKIP_PRISMA_DB_PUSH:-}" = "true" ]; then
          log "Skipping prisma db push (SKIP_PRISMA_DB_PUSH=true)."
        elif [ "$$USE_BUNDLED_DB" -eq 1 ]; then
          log "Syncing database schema (db push) against bundled Postgres..."
          npx prisma db push
        else
          log "External DATABASE_URL: skipping prisma db push (managed DB; push cannot alter existing enum columns safely)."
        fi
        log "Starting app..."
        exec node dist/index.js

  db:
    image: pgvector/pgvector:pg16-bookworm
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
    volumes:
      - redis_prod_data:/data

volumes:
  postgres_prod_data:
  redis_prod_data:
