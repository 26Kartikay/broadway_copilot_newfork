# Chat bot only (local dev): app bind-mounts the repo; Postgres + Redis use named volumes only for data.
# Always run from repo root:
#   docker compose -f docker-compose.bot.yml --env-file .env up -d --build
#
# Optional tunnel:
#   docker compose -f docker-compose.bot.yml --profile tunnel up -d

services:
  app:
    image: node:22
    working_dir: /usr/src/app
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        log() { printf '%s\n' "$${*}"; }

        log "Installing dependencies..."
        npm install --legacy-peer-deps --include=dev
        log "Dependencies installed."

        log "Checking Postgres availability..."
        until node <<'NODE' >/dev/null 2>&1; do
        const net = require('net');
        const host = process.env.POSTGRES_HOST || 'db';
        const port = Number(process.env.POSTGRES_PORT || 5432);
        const socket = net.createConnection({ host, port }, () => {
          socket.end();
          process.exit(0);
        });
        const fail = () => process.exit(1);
        socket.on('error', fail);
        setTimeout(fail, 2000);
        NODE
          sleep 1
        done
        log "Postgres is ready."

        log "Generating Prisma client..."
        npx prisma generate

        log "Preflight (legacy Product.handleId unique constraint)..."
        npx prisma db execute --file scripts/preflight-db-push.sql --schema prisma/schema.prisma

        log "Pushing database schema..."
        npx prisma db push --accept-data-loss
        log "Database schema is in sync."

        if [ "$$NODE_ENV" = "production" ]; then
          log "Building project..."
          npm run build
          log "Starting production server..."
          npm start
        else
          log "Starting development server..."
          npm run dev
        fi
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/broadway?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
      - dist:/usr/src/app/dist
      - uploads_data:/usr/src/app/uploads
    networks:
      - broadway-network

  db:
    image: pgvector/pgvector:pg16-bookworm
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: broadway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v0_8_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broadway-network

  redis:
    image: redis:8
    command:
      - redis-server
      - --loglevel
      - warning
    volumes:
      - redis_data:/data
    networks:
      - broadway-network

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - tunnel
    command:
      - http
      - --domain=${NGROK_DOMAIN}
      - "app:${PORT:-8080}"
      - --log=stdout
      - --log-level=warn
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    networks:
      - broadway-network

networks:
  broadway-network:
    name: broadway-network

volumes:
  node_modules:
  dist:
  uploads_data:
  postgres_data_v0_8_0:
  redis_data:
