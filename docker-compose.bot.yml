# Chat bot only (local dev): app bind-mounts the repo; Postgres + Redis run in Docker (named volumes for data).
# Always run from repo root:
#   docker compose -f docker-compose.bot.yml --env-file .env up -d --build
#
# Postgres (container `db`): set POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB in .env — they must match
# DATABASE_URL (same user/password/db/host `db`, port `5432` inside the network). If DATABASE_URL is unset,
# the default below uses those variables.
#
# Redis (container `redis`): no password. The app is always given REDIS_URL=redis://redis:6379 here so a
# REDIS_URL in .env (e.g. Redis Cloud or host.docker.internal with AUTH) does not override and break WRONGPASS.
# Optional: set REDIS_PUBLISH_PORT to expose Redis on 127.0.0.1 for host-side tools (default 6379).
#
# Optional tunnel:
#   docker compose -f docker-compose.bot.yml --profile tunnel up -d

services:
  app:
    image: node:22
    working_dir: /usr/src/app
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        log() { printf '%s\n' "$${*}"; }

        log "Installing dependencies..."
        npm install --legacy-peer-deps --include=dev
        log "Dependencies installed."

        log "Checking Postgres availability..."
        until node <<'NODE' >/dev/null 2>&1; do
        const net = require('net');
        const host = process.env.POSTGRES_HOST || 'db';
        const port = Number(process.env.POSTGRES_PORT || 5432);
        const socket = net.createConnection({ host, port }, () => {
          socket.end();
          process.exit(0);
        });
        const fail = () => process.exit(1);
        socket.on('error', fail);
        setTimeout(fail, 2000);
        NODE
          sleep 1
        done
        log "Postgres is ready."

        log "Generating Prisma client..."
        npx prisma generate

        log "Preflight (legacy Product.handleId unique constraint)..."
        npx prisma db execute --file scripts/preflight-db-push.sql --schema prisma/schema.prisma

        log "Pushing database schema..."
        npx prisma db push --accept-data-loss
        log "Database schema is in sync."

        if [ "$$NODE_ENV" = "production" ]; then
          log "Building project..."
          npm run build
          log "Starting production server..."
          npm start
        else
          log "Starting development server..."
          npm run dev
        fi
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8080}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-broadway}?schema=public}
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/usr/src/app/uploads}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
      - dist:/usr/src/app/dist
      - uploads_data:/usr/src/app/uploads
    networks:
      - broadway-network

  guest-cleanup-cron:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-broadway}?schema=public}
      # Default: run hourly. Override in .env if needed.
      GUEST_CLEANUP_CRON: ${GUEST_CLEANUP_CRON:-0 * * * *}
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        : "${DATABASE_URL:?DATABASE_URL is required for guest cleanup cron}"
        CRON_EXPR="${GUEST_CLEANUP_CRON:-0 * * * *}"

        printf 'export DATABASE_URL=%q\n' "$${DATABASE_URL}" > /etc/guest-cleanup.env
        cat > /usr/local/bin/run-guest-cleanup.sh <<'EOF'
        #!/bin/bash
        set -Eeuo pipefail
        source /etc/guest-cleanup.env
        psql "$${DATABASE_URL}" -c "DELETE FROM \"User\" WHERE \"isGuest\" = true OR LOWER(TRIM(\"profileName\")) = 'guest';"
        EOF
        chmod +x /usr/local/bin/run-guest-cleanup.sh

        cat > /etc/cron.d/guest-user-cleanup <<EOF
        SHELL=/bin/bash
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        $${CRON_EXPR} root /usr/local/bin/run-guest-cleanup.sh >> /var/log/guest-user-cleanup.log 2>&1
        EOF
        chmod 0644 /etc/cron.d/guest-user-cleanup
        crontab /etc/cron.d/guest-user-cleanup
        touch /var/log/guest-user-cleanup.log
        exec cron -f
    depends_on:
      db:
        condition: service_healthy
    networks:
      - broadway-network

  db:
    image: pgvector/pgvector:pg16-bookworm
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
      - -c
      - log_error_verbosity=terse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data_v0_8_0:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broadway-network

  redis:
    image: redis:8
    command:
      - redis-server
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - broadway-network

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - tunnel
    command:
      - http
      - --domain=${NGROK_DOMAIN}
      - "app:${PORT:-8080}"
      - --log=stdout
      - --log-level=warn
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    ports:
      - "4040:4040"
    networks:
      - broadway-network

networks:
  broadway-network:
    name: broadway-network

volumes:
  node_modules:
  dist:
  uploads_data:
  postgres_data_v0_8_0:
  redis_data:
