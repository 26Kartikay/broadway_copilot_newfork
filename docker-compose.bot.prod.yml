# Production-style stack: bot + optional dashboard + analytics-api + Postgres + Redis.
# User/chat images under /app/uploads — mount a host directory so uploads survive restarts.
#
# Usage (from repo root):
#   docker compose -f docker-compose.bot.prod.yml --env-file .env up -d --build
#
# Bot only (no dashboard / analytics):
#   docker compose -f docker-compose.bot.prod.yml up -d app db redis guest-cleanup-cron
#
# Bot + dashboard + analytics (no dev bind-mount stack):
#   docker compose -f docker-compose.bot.prod.yml up -d --build
#
# analytics-api: requires the analysis_agent source tree on the host (see ANALYSIS_AGENT_BUILD_CONTEXT in .env).
#   Default context ../analysis_agent → clone/copy next to this repo, e.g. ~/analysis_agent beside ~/broadway_copilot_newfork
#   Or clone into this repo and set ANALYSIS_AGENT_BUILD_CONTEXT=./analysis_agent
#   Bot + event storage only (no SQL analytics API): omit analytics-api from the up command.
#
# Set PORT / SERVER_URL consistently (same port inside container and in SERVER_URL).
#   export SERVER_URL=https://api.yourdomain.com
# SERVER_URL must be ONLY the base URL (no leading "SERVER_URL=" — do not paste a full .env line as the value).
#
# DATABASE_URL: set in .env to your real Postgres (e.g. RDS). If unset, defaults to bundled `db`.
# External URLs must not use host "localhost" from inside the container.
# For RDS/managed DBs, `db push` is skipped automatically. Use `prisma migrate deploy` or manual SQL.
# SKIP_PRISMA_DB_PUSH=true to never run db push on startup.
# UPLOADS_HOST_DIR: host dir → /app/uploads (default ./uploads).
# UPLOADS_ROOT: must match in-container mount (default /app/uploads in Dockerfile).
#
# Optional (faster repeat builds): BuildKit cache — requires a BuildKit-capable daemon:
#   export DOCKER_BUILDKIT=1
# Dockerfile stays compatible without it (works on Ubuntu 20.04 / older docker-compose).

name: broadway-bot-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: broadway-bot-prod-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/broadway?schema=public}
      REDIS_URL: redis://redis:6379
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL in .env or environment (public base URL, no default)}
      UPLOADS_ROOT: ${UPLOADS_ROOT:-/app/uploads}
      SKIP_PRISMA_DB_PUSH: ${SKIP_PRISMA_DB_PUSH:-}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads

    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        log() { printf '%s\n' "$${*}"; }

        log "Waiting for Postgres..."
        until node <<'NODE' >/dev/null 2>&1; do
        const net = require('net');
        const host = process.env.POSTGRES_HOST || 'db';
        const port = Number(process.env.POSTGRES_PORT || 5432);
        const socket = net.createConnection({ host, port }, () => {
          socket.end();
          process.exit(0);
        });
        const fail = () => process.exit(1);
        socket.on('error', fail);
        setTimeout(fail, 2000);
        NODE
          sleep 1
        done
        log "Postgres is ready."

        log "Preflight (legacy Product.handleId unique constraint)..."
        npx prisma db execute --file scripts/preflight-db-push.sql --schema prisma/schema.prisma

        USE_BUNDLED_DB=0
        case "$${DATABASE_URL:-}" in *"@db:"*) USE_BUNDLED_DB=1 ;; esac
        if [ "$${SKIP_PRISMA_DB_PUSH:-}" = "true" ]; then
          log "Skipping prisma db push (SKIP_PRISMA_DB_PUSH=true)."
        elif [ "$$USE_BUNDLED_DB" -eq 1 ]; then
          log "Syncing database schema (db push) against bundled Postgres..."
          npx prisma db push
        else
          log "External DATABASE_URL: skipping prisma db push (managed DB; push cannot alter existing enum columns safely)."
        fi
        log "Starting app..."
        exec node dist/index.js

  guest-cleanup-cron:
    image: broadway-bot-prod-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/broadway?schema=public}
      # Default: run hourly. Override in .env if needed.
      GUEST_CLEANUP_CRON: ${GUEST_CLEANUP_CRON:-0 * * * *}
    command:
      - /bin/bash
      - -lc
      - |
        set -Eeuo pipefail
        : "${DATABASE_URL:?DATABASE_URL is required for guest cleanup cron}"
        CRON_EXPR="${GUEST_CLEANUP_CRON:-0 * * * *}"

        printf 'export DATABASE_URL=%q\n' "$${DATABASE_URL}" > /etc/guest-cleanup.env
        cat > /usr/local/bin/run-guest-cleanup.sh <<'EOF'
        #!/bin/bash
        set -Eeuo pipefail
        source /etc/guest-cleanup.env
        psql "$${DATABASE_URL}" -c "DELETE FROM \"User\" WHERE \"isGuest\" = true OR LOWER(TRIM(\"profileName\")) = 'guest';"
        EOF
        chmod +x /usr/local/bin/run-guest-cleanup.sh

        cat > /etc/cron.d/guest-user-cleanup <<EOF
        SHELL=/bin/bash
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        $${CRON_EXPR} root /usr/local/bin/run-guest-cleanup.sh >> /var/log/guest-user-cleanup.log 2>&1
        EOF
        chmod 0644 /etc/cron.d/guest-user-cleanup
        crontab /etc/cron.d/guest-user-cleanup
        touch /var/log/guest-user-cleanup.log
        exec cron -f
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/broadway?schema=public}
        REDIS_URL: redis://redis:6379
        PORT: ${DASHBOARD_PORT:-8090}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-broadway}?schema=public}
      REDIS_URL: redis://redis:6379
      PORT: ${DASHBOARD_PORT:-8090}
      ADMIN_SECRET: ${ADMIN_SECRET:-prod-secret-change-me}
      NODE_ENV: production
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL in .env or environment (public base URL, no default)}
      CHAT_API_URL: ${CHAT_API_URL:-http://app:${PORT:-8080}}
      ANALYTICS_API_URL: http://analytics-api:8000
    ports:
      - "${DASHBOARD_PORT:-8090}:${DASHBOARD_PORT:-8090}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      analytics-api:
        condition: service_healthy

  analytics-api:
    build:
      context: ${ANALYSIS_AGENT_BUILD_CONTEXT:-../analysis_agent}
      dockerfile: Dockerfile.api
    image: ${ANALYTICS_API_IMAGE:-broadway-bot-prod-analytics-api}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_CONNECTION_STRING: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-broadway}?schema=public}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACCESSIBLE_TABLES: ${ANALYTICS_ACCESSIBLE_TABLES:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANALYTICS_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s

  db:
    image: pgvector/pgvector:pg16-bookworm
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --loglevel
      - warning
    volumes:
      - redis_prod_data:/data

volumes:
  postgres_prod_data:
  redis_prod_data:
