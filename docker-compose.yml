# Default `docker compose` from repo root = full local stack (bot + dashboard + db + redis).
# Requires Docker Compose v2.20+ (`include`). If unsupported, run:
#   docker compose -f docker-compose.stack.yml --env-file .env up -d --build
#
# Named files (always run from repo root):
#   docker compose -f docker-compose.bot.yml ...
#   docker compose -f docker-compose.dashboard.yml ...
#   docker compose -f docker-compose.stack.yml ...
# Production bot image:
#   docker compose -f docker-compose.bot.prod.yml ...

include:
  - path: docker-compose.stack.yml
