# Standalone dashboard: expects external network `broadway-network` (e.g. from root compose) or adjust below.
# Set URLs in `.env` at repo root (or pass `--env-file`); do not rely on hardcoded hosts.
#
# Required for DB access:
#   DATABASE_URL=postgresql://user:pass@host:5432/db?schema=public
# Optional:
#   REDIS_URL=redis://redis:6379
#   DASHBOARD_PORT=8090
#   CHAT_API_URL=https://your-api.example.com   (optional; shown in Settings)
#   SERVER_URL=https://your-api.example.com     (fallback if CHAT_API_URL unset)
#   ENV_FILE=.env.production

services:
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in environment or .env}
        REDIS_URL: ${REDIS_URL:-}
        PORT: ${DASHBOARD_PORT:-8090}
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in environment or .env}
      REDIS_URL: ${REDIS_URL:-}
      PORT: ${DASHBOARD_PORT:-8090}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      NODE_ENV: ${NODE_ENV:-production}
      SERVER_URL: ${SERVER_URL:-}
      CHAT_API_URL: ${CHAT_API_URL:-}
    ports:
      - "${DASHBOARD_PORT:-8090}:${DASHBOARD_PORT:-8090}"
    networks:
      - broadway-network

networks:
  broadway-network:
    name: broadway-network
    external: true
