# Admin dashboard for local development: dashboard + Postgres (pgvector) + Redis + analytics-api (all in Docker).
# Data is persisted in named volumes. Set POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB to match DATABASE_URL.
# From repo root (broadway_copilot_newfork):
#   docker compose -f docker-compose.dashboard.yml --env-file .env up -d --build
#
# analytics-api build context: ANALYSIS_AGENT_BUILD_CONTEXT in .env (default ../analysis_agent).
#   Sibling layout: ~/analysis_agent and ~/broadway_copilot_newfork
#   Or clone into repo: ./analysis_agent with ANALYSIS_AGENT_BUILD_CONTEXT=./analysis_agent
#
# You do NOT start the analytics agent separately when using this file — the `analytics-api`
# service is uvicorn on port 8000. If you run the dashboard on the host (npm) instead of
# Docker, publish 8000 (see ports below) and set ANALYTICS_API_URL=http://localhost:8000.
#
# Defaults: DATABASE_URL from .env or built from POSTGRES_*; Redis is fixed to redis://redis:6379 (no AUTH) for the bundled container.

name: broadway-dashboard

services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-broadway}?schema=public}
        REDIS_URL: redis://redis:6379
        PORT: ${DASHBOARD_PORT:-8090}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-broadway}?schema=public}
      REDIS_URL: redis://redis:6379
      PORT: ${DASHBOARD_PORT:-8090}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      NODE_ENV: ${NODE_ENV:-development}
      SERVER_URL: ${SERVER_URL:-}
      CHAT_API_URL: ${CHAT_API_URL:-}
      ANALYTICS_API_URL: http://analytics-api:8000
    ports:
      - "${DASHBOARD_PORT:-8090}:${DASHBOARD_PORT:-8090}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      analytics-api:
        condition: service_healthy
    networks:
      - broadway-dashboard-dev

  db:
    image: pgvector/pgvector:pg16-bookworm
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - client_min_messages=warning
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-broadway}
    ports:
      - "${DASHBOARD_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_dashboard_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - broadway-dashboard-dev

  analytics-api:
    build:
      context: ${ANALYSIS_AGENT_BUILD_CONTEXT:-../analysis_agent}
      dockerfile: Dockerfile.api
    image: ${ANALYTICS_API_IMAGE:-broadway-dashboard-analytics-api}
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_CONNECTION_STRING: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-broadway}?schema=public}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ACCESSIBLE_TABLES: ${ANALYTICS_ACCESSIBLE_TABLES:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host can hit http://localhost:8000/health and ANALYTICS_API_URL for a non-Docker dashboard dev server.
      - "127.0.0.1:${ANALYTICS_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - broadway-dashboard-dev
    restart: unless-stopped

  redis:
    image: redis:8
    command:
      - redis-server
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${REDIS_PUBLISH_PORT:-6380}:6379"
    volumes:
      - redis_dashboard_dev:/data
    networks:
      - broadway-dashboard-dev

networks:
  broadway-dashboard-dev:
    name: broadway-dashboard-dev

volumes:
  postgres_dashboard_dev:
  redis_dashboard_dev:
